name: Update Forensic Research

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests

      - name: Run forensic research collector
        run: |
          python forensic_research_collector.py

      - name: Validate research feed
        run: |
          python - <<'PY'
          import json

          with open("forensic_research.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("items", [])

          print(f"Research papers in feed: {len(items)}")

          if not isinstance(items, list):
              raise SystemExit("ERROR: items is not a list")

          if len(items) == 0:
              print("WARNING: Research feed contains 0 papers.")
          else:
              print("Research feed validation successful.")
          PY

      - name: Commit updated research feed
        run: |
          if git status --porcelain -- forensic_research.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add forensic_research.json
            git commit -m "Update forensic research feed"
            git push

            echo "Research feed updated and committed."
          else
            echo "No changes to forensic_research.json."
          fi
