name: Run Forensic News Collector

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-collector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests

      - name: Run forensic news collector
        run: |
          set -e
          python forensic_news_collector.py

      - name: Commit updated Forensic_news.json
        run: |
          if git status --porcelain -- Forensic_news.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add Forensic_news.json
            git commit -m "Automated update of Forensic_news.json"
            git push

            echo "Forensic_news.json updated and committed."
          else
            echo "No changes to Forensic_news.json."
          fi
