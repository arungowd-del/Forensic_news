name: Update Forensic Research

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests

      - name: Run forensic research collector
        run: |
          python forensic_research_collector.py

      - name: Check for changes
        run: |
          git status --short
          git diff -- forensic_research.json

      - name: Commit updated research feed
        run: |
          if git status --porcelain | grep -q "forensic_research.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add forensic_research.json
            git commit -m "Automated update of forensic research feed"
            git push

            echo "Research feed updated and committed."
          else
            echo "No changes to forensic_research.json."
          fi
